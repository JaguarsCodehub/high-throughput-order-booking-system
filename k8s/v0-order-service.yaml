apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: obs-v0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      # Anti-pattern: run as root
      securityContext:
        runAsUser: 0
      containers:
      - name: order-service
        image: order-service:latest
        imagePullPolicy: Never
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: obs-config
        - secretRef:
            name: obs-secrets
        env:
        - name: OTEL_SERVICE_NAME
          value: "order-service"
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: obs-v0
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
