---
- name: Deploy Order Booking System using GitOps
  hosts: all
  become: no
  tasks:
    - name: Ensure KIND cluster is running
      ansible.builtin.shell: |
        if ! kind get clusters | grep -q 'order-booking'; then
          kind create cluster --config {{ project_dir }}/k8s/kind-config.yaml
        fi
      register: kind_cluster
      changed_when: "'Creating cluster' in kind_cluster.stdout"

    - name: Build Docker images
      ansible.builtin.shell: |
        docker build -t {{ images[item | replace('-', '_')] }} --build-arg SERVICE_NAME={{ item }} .
      args:
        chdir: "{{ project_dir }}"
      loop:
        - order-service
        - inventory-service
        - payment-service
        - notification-service
      register: build_result
      changed_when: "'Writing image' in build_result.stdout"

    - name: Load images into KIND
      ansible.builtin.shell: |
        kind load docker-image {{ images[item | replace('-', '_')] }} --name order-booking
      loop:
        - order-service
        - inventory-service
        - payment-service
        - notification-service

    - name: Ensure NGINX Ingress Controller is installed
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
      ignore_errors: yes

    # ─── ArgoCD ─────────────────────────────────────────────────────────────────
    - name: Create ArgoCD namespace
      ansible.builtin.command: kubectl create namespace argocd
      ignore_errors: yes

    - name: Install ArgoCD
      ansible.builtin.command: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      ignore_errors: yes

    - name: Wait for ArgoCD server to be ready
      ansible.builtin.shell: |
        kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=120s
      register: argocd_wait
      retries: 5
      delay: 15
      until: argocd_wait.rc == 0

    - name: Apply ArgoCD Application manifest
      ansible.builtin.command: kubectl apply -f {{ project_dir }}/argocd/application.yaml

    - name: Print ArgoCD access instructions
      ansible.builtin.debug:
        msg:
          - "ArgoCD is ready and has taken over deployment!"
          - "To access the UI, run: kubectl port-forward svc/argocd-server -n argocd 8081:443"
          - "Then open: https://localhost:8081"
          - "Username: admin"
          - "To get the initial password run: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d"
