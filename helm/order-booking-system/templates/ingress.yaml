{{- range $key, $service := .Values.microservices }}
{{- if $service.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $service.name }}
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: {{ $service.ingress.host }}
    http:
      paths:
      - path: {{ $service.ingress.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ $service.name }}
            port:
              number: {{ $service.port }}
---
{{- end }}
{{- end }}
