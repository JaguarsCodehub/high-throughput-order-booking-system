apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: obs-v0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: inventory-service
        image: inventory-service:latest
        imagePullPolicy: Never
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: obs-config
        - secretRef:
            name: obs-secrets
        env:
        - name: OTEL_SERVICE_NAME
          value: "inventory-service"
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: obs-v0
spec:
  type: NodePort
  selector:
    app: inventory-service
  ports:
    - port: 3002
      targetPort: 3002
      nodePort: 30002
