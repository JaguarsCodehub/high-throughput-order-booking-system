apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: obs-v0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: notification-service
        image: notification-service:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: obs-config
        - secretRef:
            name: obs-secrets
        env:
        - name: OTEL_SERVICE_NAME
          value: "notification-service"
        ports:
        - containerPort: 3004
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: obs-v0
spec:
  type: NodePort
  selector:
    app: notification-service
  ports:
    - port: 3004
      targetPort: 3004
      nodePort: 30004
