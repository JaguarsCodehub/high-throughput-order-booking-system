apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: obs-v0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: inventory-service
        image: inventory-service:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: obs-config
        - secretRef:
            name: obs-secrets
        env:
        - name: OTEL_SERVICE_NAME
          value: "inventory-service"
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: obs-v0
spec:
  type: NodePort
  selector:
    app: inventory-service
  ports:
    - port: 3002
      targetPort: 3002
      nodePort: 30002
