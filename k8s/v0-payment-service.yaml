apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: obs-v0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: payment-service
        image: payment-service:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: obs-config
        - secretRef:
            name: obs-secrets
        env:
        - name: OTEL_SERVICE_NAME
          value: "payment-service"
        ports:
        - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: obs-v0
spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
    - port: 3003
      targetPort: 3003
      nodePort: 30003
